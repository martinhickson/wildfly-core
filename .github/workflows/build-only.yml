name: WildFly Core Build

on:
  pull_request:
    branches:
      - '**'
    paths:
      - "**/pom.xml"
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: 'Create GitHub draft release?'
        required: false
        default: false
        type: boolean
      deploy_artifacts:
        description: 'Deploy artifacts to GitHub Maven repository?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    name: WildFly Core Build and Optional Release/Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Corretto 8 (JDK 8)
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: 'corretto'
          cache: 'maven'

      - name: Clear any possible SNAPSHOT dependencies in the local maven repository
        run: |
          LOCAL_REPO="$HOME/.m2/repository"
          echo "Cleaning SNAPSHOTS from $LOCAL_REPO"
          if [ -d "$LOCAL_REPO" ]; then find "$LOCAL_REPO" -name "*SNAPSHOT*" | xargs -I {} rm -rfv "{}"; fi
        shell: bash

      - name: Build with Maven Java 8 -Dquickly -DskipTests=true
        run: mvn -U -B -Dquickly install -DskipTests=true

      - name: Deploy artifacts to GitHub Maven Packages (Optional)
        if: ${{ github.event.inputs.deploy_artifacts == 'true' }}
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          mvn deploy -DskipTests=true -DdeployAtEnd=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-512 checksums for JARs
        run: |
          mkdir -p release-assets
          find ./ -type f -name 'wildfly*.jar' | while read jar; do
            fname=$(basename "$jar")
            if [[ "$jar" != *"/release-assets/"* && "$fname" != *"sources"* ]]; then 
              cp "$jar" "release-assets/$fname"
              sha512sum "$jar" | awk '{ print $1 }' > "release-assets/$fname.sha512"
            fi
          done
          zipname="wildfly-core-artifacts.zip"
          cd release-assets
          zip -r "../$zipname" . > /dev/null
          cd ..
          sha512sum "$zipname" | awk '{ print $1 }' > "$zipname.sha512"
          rm -rf release-assets/
        shell: bash

      - name: Create Draft Release (Optional)
        if: ${{ github.event.inputs.create_draft_release == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: draft-${{ github.run_number }}
          draft: true
          files: wildfly-core-artifacts.zip,wildfly-core-artifacts.zip.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
