name: CI

on:
  push:
    branches:
      - 28.0.1-maintenance
  pull_request:
    branches:
      - 28.0.1-maintenance
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Install Maven 3.8.9
        run: |
          base=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.9
          curl -fsSL -o "$RUNNER_TEMP/apache-maven-3.8.9-bin.tar.gz" "$base/apache-maven-3.8.9-bin.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/apache-maven-3.8.9-bin.tar.gz.sha1" "$base/apache-maven-3.8.9-bin.tar.gz.sha1"
          echo "$(tr -d '[:space:]' < "$RUNNER_TEMP/apache-maven-3.8.9-bin.tar.gz.sha1")  $RUNNER_TEMP/apache-maven-3.8.9-bin.tar.gz" | sha1sum -c -
          tar -xzf "$RUNNER_TEMP/apache-maven-3.8.9-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.8.9/bin" >> "$GITHUB_PATH"

      - name: Compile and test
        run: |
          mvn -version
          mvn -B -ntp clean install

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/surefire-reports/*.txt'
